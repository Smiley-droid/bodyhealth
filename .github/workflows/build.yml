name: Build
on:
  push:
    branches: [ "forge-1.21.1" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the jar to (optional)"
        required: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Resolve latest Forge 1.21.1
        id: forge
        run: |
          curl -fsS https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml -o meta.xml
          V=$(grep -o "<version>1\.21\.1-[^<]*</version>" meta.xml | sed 's/<[^>]*>//g; s/^1\.21\.1-//' | sort -V | tail -1)
          echo "Resolved Forge: $V"
          test -n "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace  2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Build failed — ${{ github.ref_name }} ${{ matrix.mc }}"
            echo '```'
            grep -nE "error:|What went wrong|Execution failed|FAILED|Caused by|Could not|cannot find symbol|symbol:|location:|incompatible types|does not override|no suitable" build.log | cut -c1-220 | head -60
            echo '--- Forge diag ---'
            echo "Resolved Forge: ${{ steps.forge.outputs.version }}"
            echo "gradle.properties forge_version:"; grep forge_version gradle.properties
            for f in $(find ~/.gradle -name 'forge-*.jar' 2>/dev/null); do
              n=$(unzip -l "$f" 2>/dev/null | grep -c 'RenderGuiOverlayEvent.class')
              k=$(unzip -l "$f" 2>/dev/null | grep -c 'gui/overlay/VanillaGuiOverlay.class')
              echo "$(basename $f)  RenderGuiOverlayEvent.class=$n VanillaGuiOverlay.class=$k"
            done
            echo '--- compileClasspath (forge) ---'
            ./gradlew -q dependencies --configuration compileClasspath --no-daemon 2>&1 | grep -i 'forge\|minecraft' | head -12
            echo '```'
            echo '<details><summary>log without stack frames</summary>'
            echo
            echo '```'
            grep -v '^[[:space:]]*at ' build.log | grep -v '^\.\.\. [0-9]* more' | head -90 | cut -c1-200
            echo '```'
            echo '</details>'
          } > report.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@report.md
      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "### Build OK — ${{ github.ref_name }} — Forge ${{ steps.forge.outputs.version }}" > ok.md
          ls build/libs >> ok.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@ok.md
      - uses: actions/upload-artifact@v4
        with:
          name: bodyhealth-forge-mc1.21.1
          path: build/libs/*.jar
      - name: Attach jar to release
        if: ${{ github.event.inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.inputs.release_tag }}" build/libs/*.jar --clobber
