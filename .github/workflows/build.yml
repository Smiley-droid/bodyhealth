name: Build
on:
  push:
    branches: [ "neoforge-26.x" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the jar to (optional)"
        required: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "26.1", neo: "26.1.0.19-beta" }
          - { mc: "26.2", neo: "26.2.0.93" }
          - { mc: "26.3", neo: "26.3.0.101" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace -Pminecraft_version=${{ matrix.mc }} -Pminecraft_version_range='[${{ matrix.mc }}]' -Pneo_version=${{ matrix.neo }} 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Build failed — ${{ github.ref_name }} ${{ matrix.mc }}"
            echo '```'
            grep -nE "error:|What went wrong|Execution failed|FAILED|Caused by|Could not|cannot find symbol|symbol:|location:|incompatible types|does not override|no suitable" build.log | cut -c1-300 | head -150
            echo '```'
            echo '<details><summary>log tail</summary>'
            echo
            echo '```'
            tail -40 build.log | cut -c1-300
            echo '```'
            echo '</details>'
          } > report.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@report.md
      - uses: actions/upload-artifact@v4
        with:
          name: bodyhealth-mc${{ matrix.mc }}
          path: build/libs/*.jar
      - name: Attach jar to release
        if: ${{ github.event.inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.inputs.release_tag }}" build/libs/*.jar --clobber
