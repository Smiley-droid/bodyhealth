name: Build
on:
  push:
    branches: [ "neoforge-1.21.11" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the jar to (optional)"
        required: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace 
      - uses: actions/upload-artifact@v4
        with:
          name: bodyhealth-mc1.21.11
          path: build/libs/*.jar
      - name: Attach jar to release
        if: ${{ github.event.inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.inputs.release_tag }}" build/libs/*.jar --clobber
